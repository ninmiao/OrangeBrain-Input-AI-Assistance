# XcodeGen spec for the iOS port (docs/IOS_PLAN.md). The .xcodeproj is generated
# in CI and is not committed:  cd ios && xcodegen generate
name: OrangeCell

options:
  bundleIdPrefix: io.github.ninmiao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: zh-Hans

packages:
  OCCore:
    path: Packages/OCCore
  OCRime:
    path: Packages/OCRime

settings:
  base:
    # Swift 6 compiler, Swift 5 language mode (plan section 5).
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Debug builds would otherwise split each binary into a stub plus a
    # .debug.dylib, which distorts the memory numbers of the keyboard extension.
    ENABLE_DEBUG_DYLIB: NO
    # Simulator builds are ad-hoc signed so that entitlements (App Groups) are
    # embedded; device builds are built unsigned and signed afterwards by
    # ios/scripts/make-ipa.sh (SideStore re-signs on the phone).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Static libraries from fcitx5-prebuilder exist for arm64 simulators only here.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

# Link line for everything that contains librime. -force_load keeps the plugin
# modules (lua, octagram, predict, qjs) that register themselves from static
# constructors; without it the linker drops those object files.
settingGroups:
  rimeLink:
    OC_DEPS_DIR: "$(SRCROOT)/.deps/os64"
    "OC_DEPS_DIR[sdk=iphonesimulator*][arch=arm64]": "$(SRCROOT)/.deps/sim-arm64"
    "OC_DEPS_DIR[sdk=iphonesimulator*][arch=x86_64]": "$(SRCROOT)/.deps/sim-x86_64"
    LIBRARY_SEARCH_PATHS:
      - "$(inherited)"
      - "$(OC_DEPS_DIR)/lib"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-force_load"
      - "$(OC_DEPS_DIR)/lib/librime.a"
      - "-lqjs"
      - "-lleveldb"
      - "-lglog"
      - "-llua"
      - "-lmarisa"
      - "-lopencc"
      - "-lyaml-cpp"
      - "-lzstd"
      - "-lboost_container"
      - "-lboost_iostreams"
      - "-lboost_random"
      - "-lc++"

targets:
  OrangeCell:
    type: application
    platform: iOS
    sources:
      - path: OrangeCell
      # Compiled Rime data (ios/scripts/build-rime-data.sh); the keyboard reads it
      # from the containing app bundle and never deploys.
      - path: .rime-data/rime-shared
        type: folder
        buildPhase: resources
        optional: true
    settings:
      groups: [rimeLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ninmiao.orangecell
        PRODUCT_NAME: OrangeCell
    entitlements:
      path: Config/OrangeCell.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.ninmiao.orangecell
    info:
      path: Config/OrangeCell-Info.plist
      properties:
        CFBundleDisplayName: 橘脑一颗
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: OrangeCellKeyboard
      - package: OCCore
      - package: OCRime
      - sdk: JavaScriptCore.framework

  OrangeCellKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: OrangeCellKeyboard
    settings:
      groups: [rimeLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ninmiao.orangecell.keyboard
        PRODUCT_NAME: OrangeCellKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: Config/OrangeCellKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.ninmiao.orangecell
    info:
      path: Config/OrangeCellKeyboard-Info.plist
      properties:
        CFBundleDisplayName: 橘脑一颗
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    dependencies:
      - package: OCCore
      - package: OCRime
      - sdk: JavaScriptCore.framework

  # Simulator-only: one text field that takes focus at launch.
  OCTestHost:
    type: application
    platform: iOS
    sources:
      - path: OCTestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ninmiao.orangecell.testhost
        PRODUCT_NAME: OCTestHost
    info:
      path: Config/OCTestHost-Info.plist
      properties:
        CFBundleDisplayName: OCTestHost
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # Logic tests (no host app) that link librime directly.
  OrangeCellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/OrangeCellTests
    settings:
      groups: [rimeLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ninmiao.orangecell.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: OCCore
      - package: OCRime
      - sdk: JavaScriptCore.framework

  OrangeCellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/OrangeCellUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ninmiao.orangecell.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OCTestHost

schemes:
  OrangeCell:
    build:
      targets:
        OrangeCell: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrangeCellTests
    archive:
      config: Release
  OCUITests:
    build:
      targets:
        OCTestHost: all
        OrangeCell: [build]
    test:
      config: Debug
      targets:
        - OrangeCellUITests
