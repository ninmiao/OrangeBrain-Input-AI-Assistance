name: OrangeCell cloud builds

on:
  workflow_dispatch:
  push:
    branches: [build/cloud-test]

permissions:
  contents: read

concurrency:
  group: orangecell-cloud-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'manual' }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/windows-downloads/*.7z
            .tools/windows-downloads/boost-*.tar.xz
            .tools/boost-win64/lib
            .tools/boost-win32/lib
            .tools/boost-winarm64/lib
          key: windows-v143-x64-${{ hashFiles('windows/scripts/prepare-deps.py') }}
      - name: Prepare native dependencies
        run: |
          $vsInstaller = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $vsInstaller -Encoding UTF8
          $env:Path = "$vsInstaller;$env:Path"
          python windows/scripts/prepare-deps.py --reuse-boost
          if ($LASTEXITCODE) { throw 'Windows dependencies failed' }
      - name: Build native input service
        run: |
          ./windows/scripts/build-native.ps1
          ./windows/scripts/test-components.ps1
          ./windows/scripts/test-native.ps1 -Platform x64
          ./windows/scripts/test-native.ps1 -Platform x86
      - name: Build and verify installer
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'orangecell-image'
          $output = Join-Path $env:RUNNER_TEMP 'orangecell-output'
          ./windows/scripts/package.ps1 -Destination $destination
          $image = Join-Path $destination 'OrangeCellSettings'
          python windows/scripts/verify-package.py $image
          if ($LASTEXITCODE) { throw 'Windows image architecture check failed' }
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$compiler) {
            $compiler = (Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe" |
              Select-Object -First 1).FullName
          }
          if (!$compiler) { throw 'Inno Setup compiler is missing' }
          $version = (Get-Item (Join-Path $image 'OrangeCellSettings.exe')).VersionInfo.ProductVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Windows version' }
          ./windows/scripts/build-installer.ps1 -Image $image -Version $version -Compiler $compiler -OutputDirectory $output
          $installer = Get-Item -LiteralPath "$output/OrangeCell-Windows-$version-Setup-x86-arm64.exe"
          if ($installer.VersionInfo.ProductVersion.Trim() -ne $version) { throw 'Installer version mismatch' }
          $digest = (Get-FileHash -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content -LiteralPath "$output/SHA256SUMS" -Encoding ASCII
      # The runner builds in UTC. Install west of UTC, as users do, and fail if any
      # installed file is dated in the future: Rime treats newer data files as
      # modified and redeploys on every start.
      - name: Install west of UTC and check file times
        timeout-minutes: 5
        run: |
          tzutil /s "Central Standard Time"
          if ($LASTEXITCODE) { throw 'Cannot change the runner time zone' }
          $installer = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'orangecell-output') -Filter 'OrangeCell-Windows-*-Setup-x86-arm64.exe'
          # Wait for Setup itself only. Start-Process -Wait would also wait for the
          # broker and input service that Setup leaves running, which never exit.
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -PassThru
          if (!$setup.WaitForExit(180000)) { throw 'Silent install did not finish in 3 minutes' }
          if ($setup.ExitCode) { throw "Silent install failed: $($setup.ExitCode)" }
          $root = Join-Path $env:ProgramFiles 'OrangeCell'
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File)
          if ($files.Count -lt 20) { throw 'Install produced too few files' }
          $limit = (Get-Date).AddMinutes(5)
          $future = @($files | Where-Object { $_.LastWriteTime -gt $limit })
          if ($future.Count) {
            $future | Select-Object -First 5 FullName, LastWriteTime | Format-Table -AutoSize | Out-String | Write-Output
            throw "$($future.Count) installed files are dated in the future"
          }
          "Checked $($files.Count) installed files in $((Get-TimeZone).Id): none dated in the future"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: ${{ runner.temp }}/orangecell-output/
          if-no-files-found: error
          retention-days: 7

  # Windows on ARM: install the same x64 setup on a real ARM64 Windows runner and prove
  # the ARM64X forwarder serves native ARM64 apps with the ARM64 module and emulated x64
  # apps with the x64 module, through OS-managed TSF activation.
  windows-arm64-check:
    name: Windows on ARM install check
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: ${{ runner.temp }}/windows-x64
      - name: Install and check ARM64X activation in ARM64 and x64 processes
        timeout-minutes: 12
        run: |
          $installer = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-x64') -Filter 'OrangeCell-Windows-*-Setup-x86-arm64.exe'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -PassThru
          if (!$setup.WaitForExit(300000)) { throw 'Silent install did not finish in 5 minutes' }
          if ($setup.ExitCode) { throw "Silent install failed: $($setup.ExitCode)" }
          $root = Join-Path $env:ProgramFiles 'OrangeCell'
          $state = Get-Content -LiteralPath (Join-Path $root 'installation.json') -Raw | ConvertFrom-Json
          foreach ($key in 'arm64', 'arm64x', 'x64', 'x86') {
            if (!$state.$key -or !(Test-Path -LiteralPath (Join-Path $root $state.$key))) { throw "Missing $key input module" }
          }
          $forwarder = Join-Path $root $state.arm64x
          $server = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Classes\CLSID\{7A61AC12-AF2D-4810-895E-09DB95C0D3B2}\InprocServer32').'(default)'
          if ($server -ne $forwarder) { throw "TSF server is $server, expected $forwarder" }
          "TSF server registered as $server"
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath
          $out = Join-Path $env:RUNNER_TEMP 'tsf-load'
          New-Item -ItemType Directory -Path $out | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE 'windows/tests/tsf_load_test.cpp'
          foreach ($case in @(@('arm64', 'vcvarsarm64', $state.arm64, $state.x64), @('x64', 'vcvarsarm64_amd64', $state.x64, $state.arm64))) {
            $arch, $vcvars, $expected, $other = $case
            $exe = Join-Path $out "tsf_load_$arch.exe"
            $cmd = Join-Path $out "build_$arch.cmd"
            "@echo off`r`ncall `"$vs/VC/Auxiliary/Build/$vcvars.bat`" >nul`r`nif errorlevel 1 exit /b 1`r`ncl /nologo /utf-8 /EHsc /std:c++17 /MT `"$source`" /Fe`"$exe`" /Fo`"$out/tsf_load_$arch.obj`" /link ole32.lib uuid.lib`r`n" |
              Set-Content -LiteralPath $cmd -Encoding ASCII
            & cmd.exe /c $cmd
            if ($LASTEXITCODE) { throw "Cannot build the $arch load test" }
            $result = & $exe $forwarder --registered | Out-String
            $code = $LASTEXITCODE
            Write-Output "[$arch] $result"
            if ($code) { throw "An $arch process could not activate the input method: exit $code" }
            if ($result -notmatch [regex]::Escape($expected)) { throw "An $arch process did not load $expected" }
            if ($result -match [regex]::Escape($other)) { throw "An $arch process also loaded $other" }
          }

  android:
    name: Android arm64
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      BUILD_ABI: arm64-v8a
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/boost-1.89.0.tar.xz
          key: android-arm64-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/**/*.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Prepare Android build environment
        run: |
          if (!$env:JAVA_HOME_17_X64) { throw 'JDK 17 is missing' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "JAVA_HOME=$env:JAVA_HOME_17_X64" -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PYTHON_EXECUTABLE=$((Get-Command python.exe).Source)" -Encoding UTF8
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.31.6'
          if ($LASTEXITCODE) { throw 'Android SDK setup failed' }
          ./android/script/prepare-native.ps1
      - name: Build and verify ARM64 demo APK
        run: |
          ./gradlew.bat :app:assembleDemo :ai-core:test --console=plain --no-daemon
          if ($LASTEXITCODE) { throw 'Android build failed' }
          $apkDir = 'android/app/build/outputs/apk/demo'
          python android/script/verify-apk-core.py $apkDir
          if ($LASTEXITCODE) { throw 'APK content check failed' }
          $apk = Get-Item -LiteralPath (Join-Path $apkDir ((Get-Content -Raw "$apkDir/output-metadata.json" | ConvertFrom-Json).elements[0].outputFile))
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
          $badging = & "$buildTools/aapt.exe" dump badging $apk.FullName
          if ($LASTEXITCODE -or !($badging -match "^native-code: 'arm64-v8a'$")) {
            throw 'APK ARM64 ABI check failed'
          }
          & "$buildTools/apksigner.bat" verify $apk.FullName
          if ($LASTEXITCODE) { throw 'APK signature verification failed' }
          $output = Join-Path $env:RUNNER_TEMP 'orangecell-output'
          New-Item -ItemType Directory -Path $output | Out-Null
          Copy-Item -LiteralPath $apk.FullName -Destination $output
          $digest = (Get-FileHash -LiteralPath $apk.FullName).Hash.ToLowerInvariant()
          "$digest  $($apk.Name)" | Set-Content -LiteralPath "$output/SHA256SUMS" -Encoding ASCII
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-arm64
          path: ${{ runner.temp }}/orangecell-output/
          if-no-files-found: error
          retention-days: 7

  dist:
    name: Collect dist
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: ${{ runner.temp }}/windows-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-arm64
          path: ${{ runner.temp }}/android-arm64
      - name: Verify and combine installers
        shell: bash
        run: |
          shopt -s nullglob
          windows=("$RUNNER_TEMP"/windows-x64/OrangeCell-Windows-*-Setup-x86-arm64.exe)
          android=("$RUNNER_TEMP"/android-arm64/OrangeCell-*-arm64-v8a-demo.apk)
          [[ ${#windows[@]} -eq 1 && ${#android[@]} -eq 1 ]]
          (cd "$RUNNER_TEMP/windows-x64" && tr -d '\r' < SHA256SUMS | sha256sum --check -)
          (cd "$RUNNER_TEMP/android-arm64" && tr -d '\r' < SHA256SUMS | sha256sum --check -)
          mkdir "$RUNNER_TEMP/dist"
          cp -- "${windows[0]}" "${android[0]}" "$RUNNER_TEMP/dist/"
          (cd "$RUNNER_TEMP/dist" && sha256sum -- *.exe *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7
