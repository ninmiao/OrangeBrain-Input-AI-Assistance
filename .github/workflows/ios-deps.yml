name: iOS deps mirror

# Copies the SHA-256-pinned prebuilt iOS libraries (ios/deps.lock.json) from the
# rolling upstream release into this repository's own release, so builds keep
# working if upstream replaces or removes them (docs/IOS_PLAN.md section 6.4).
# Manual only. ios/scripts/fetch-deps.sh tries the mirror first, then upstream.

on:
  # Dispatch only works for workflows on the default branch, so the mirror also
  # runs by itself whenever the lock file (or this workflow) changes on `ios`.
  push:
    branches: [ios]
    paths:
      - 'ios/deps.lock.json'
      - 'ios/scripts/mirror-deps.sh'
      - '.github/workflows/ios-deps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare
        shell: bash
        run: |
          echo "CI_OUT=$GITHUB_WORKSPACE/ci-out/mirror" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/ci-out/mirror/logs"
      - name: Verify and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ios/scripts/ci_step.sh mirror-deps -- bash ios/scripts/mirror-deps.sh
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "#### mirror"
            echo "- release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$(python3 -c "import json; print(json.load(open('ios/deps.lock.json',encoding='utf8'))['mirrorTag'])")"
            tail -n 5 "$CI_OUT/logs/mirror-deps.tail.txt" 2>/dev/null | sed 's/^/- /' || true
          } > "$CI_OUT/summary.md"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-mirror
          path: |
            ci-out/mirror
            !ci-out/mirror/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish-results:
    name: publish-results
    if: always()
    needs: [mirror]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ci-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: ci-*
          path: ci-collected
      - name: Publish to the ci-results branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          COLLECTED: ci-collected
        run: python3 ios/scripts/ci_publish.py
