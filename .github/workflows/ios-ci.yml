name: iOS CI

# Builds and tests the iOS port on GitHub-hosted runners (there is no Mac here)
# and publishes the results to the orphan branch `ci-results`, which
# ios/scripts/ci_wait.py reads (docs/IOS_PLAN.md section 6). Pushes to the `ios`
# branch additionally refresh the `ios-nightly` prerelease and the SideStore
# source. No Apple certificate or API key is used anywhere.

on:
  push:
    branches: [ios, 'ios/**']
    paths:
      - 'ios/**'
      - 'shared/native-core/**'
      - '.github/workflows/ios-*.yml'
      - '.github/actions/ios-*/**'
      # Rime data that Android ships and iOS compiles from the same files.
      - 'android/app/src/main/assets/shared/**'
      - 'android/app/data/rime/prelude/**'
      # The truncation corpus shared with Android and Windows (OCCore tests read it).
      - 'tests/corpus/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Marketing version per milestone, last number = run number: strictly increasing, so
  # SideStore always sees a new build as an update. CFBundleVersion is the run number too.
  OC_VERSION: '0.2.${{ github.run_number }}'
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  core-linux:
    name: core-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.2-noble@sha256:576698469fd3cf95b2abdeb91a7571d3afcd91806c87283dd01d564803554c0f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare
        shell: bash
        run: |
          echo "CI_OUT=$GITHUB_WORKSPACE/ci-out/core-linux" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/ci-out/core-linux/logs"
      - name: Install build tools
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh apt -- bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake g++ make default-jdk-headless python3 && swift --version && cmake --version | head -n 1'
      - name: native-core C++ test (CMake, includes the C API cases)
        shell: bash
        run: |
          # The CMake file asks for JNI (Android bridge). Only the headers are needed
          # to compile jni.cpp, so the AWT / JVM library lookups are answered by hand.
          export JH="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          bash ios/scripts/ci_step.sh native-core-test -- bash -c 'cmake -S shared/native-core -B build/native-core -DCMAKE_BUILD_TYPE=Release -DJAVA_HOME="$JH" -DJAVA_INCLUDE_PATH="$JH/include" -DJAVA_INCLUDE_PATH2="$JH/include/linux" -DJAVA_AWT_INCLUDE_PATH="$JH/include" -DJAVA_AWT_LIBRARY=not-needed -DJAVA_JVM_LIBRARY=not-needed && cmake --build build/native-core -j 4 && ctest --test-dir build/native-core --output-on-failure -V'
      - name: OCCore swift test
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh swift-test-linux -- bash -c 'cd ios/Packages/OCCore && swift test'
      - name: Check that the OCCore tests really ran (Linux)
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 ios/scripts/check_tests.py "$CI_OUT/logs/swift-test-linux.log"
      - name: Summary
        if: always()
        shell: bash
        run: python3 ios/scripts/ci_summary.py core-linux --out "$CI_OUT"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-core-linux
          path: |
            ci-out/core-linux
            !ci-out/core-linux/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Compiles the schema and dictionaries Android already ships into build/*.bin with
  # oc_deployer (pinned macOS librime). Cached on the inputs, so most runs only restore.
  rime-data:
    name: rime-data
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-mac-setup
        with:
          job: rime-data
          variants: macos-arm64
          rime-data: 'false'
      - name: Cache the compiled data
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ios/.rime-data/rime-shared
          key: rime-data-v1-${{ hashFiles('ios/deps.lock.json', 'ios/rime/**', 'ios/tools/oc_deployer/**', 'ios/scripts/build-rime-data.sh', 'android/app/src/main/assets/shared/default.yaml', 'android/app/src/main/assets/shared/orangecell-dictionaries.json', 'android/app/src/main/assets/shared/orangecell_wanxiang*', 'android/app/src/main/assets/shared/orangecell_wanxiang*/**', 'android/app/data/rime/prelude/**') }}
      - name: Compile the Rime data
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash ios/scripts/ci_step.sh rime-data -- bash ios/scripts/build-rime-data.sh
      - name: Verify the data against the pinned librime files
        shell: bash
        run: bash ios/scripts/ci_step.sh verify-data-libs -- python3 ios/scripts/verify-data-libs.py ios/.rime-data/rime-shared ios/deps.lock.json
      - name: Record the size of what was built
        if: always()
        shell: bash
        run: |
          {
            echo "#### rime-data"
            echo "- cache hit: ${{ steps.cache.outputs.cache-hit }}"
            if [ -f ios/.rime-data/rime-shared/oc-data.json ]; then
              python3 - <<'PY'
          import json
          d = json.load(open("ios/.rime-data/rime-shared/oc-data.json", encoding="utf8"))
          total = sum(f["size"] for f in d["files"])
          print(f"- compiled with librime {d['builtWithLibrime']}, {len(d['files'])} files, {total / 1048576:.1f} MiB; dictionary {d['dictionary']['name']} {d['dictionary']['version']}")
          for f in sorted(d["files"], key=lambda f: -f["size"])[:8]:
              print(f"  - {f['size'] / 1048576:.2f} MiB {f['path']}")
          PY
            fi
            du -sh ios/.rime-data/rime-shared 2>/dev/null | sed 's/^/- bundle size: /' || true
          } > "$CI_OUT/summary.md"
          cat "$CI_OUT/summary.md"
      - name: Publish the data for the other jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rime-shared
          path: ios/.rime-data/rime-shared
          compression-level: 1
          if-no-files-found: error
          retention-days: 7
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-rime-data
          path: |
            ci-out/rime-data
            !ci-out/rime-data/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  build-test:
    name: build-test
    needs: [rime-data]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-mac-setup
        with:
          job: build-test
      - name: Create the simulator
        shell: bash
        run: bash ios/scripts/ci_step.sh simulator-create -- bash ios/scripts/create-sim.sh
      - name: Build for the simulator (Debug)
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh build-sim -- xcodebuild build-for-testing \
            -project ios/OrangeCell.xcodeproj -scheme OrangeCell -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$OC_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: App unit tests (simulator, real Rime data)
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/results/unit.xcresult"
          export TEST_RUNNER_OC_INFO_FILE="$CI_OUT/logs/ocinfo.txt"
          export TEST_RUNNER_OC_RIME_SHARED="$GITHUB_WORKSPACE/ios/.rime-data/rime-shared"
          bash ios/scripts/ci_step.sh unit-tests -- xcodebuild test-without-building \
            -project ios/OrangeCell.xcodeproj -scheme OrangeCell -configuration Debug \
            -destination "id=$SIM_UDID" -derivedDataPath build/dd \
            -only-testing:OrangeCellTests -skip-testing:OrangeCellTests/MemoryBudgetTests \
            -resultBundlePath "$RUNNER_TEMP/results/unit.xcresult"
      - name: Check that the unit-tests tests really ran
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 ios/scripts/check_tests.py "$CI_OUT/logs/unit-tests.log"
      - name: Build the UI tests
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh build-ui-tests -- xcodebuild build-for-testing             -project ios/OrangeCell.xcodeproj -scheme OCUITests -configuration Debug             -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd             ARCHS=arm64 ONLY_ACTIVE_ARCH=NO             MARKETING_VERSION="$OC_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: In-process keyboard UI tests (the real KeyboardView as a text view's input view)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          DERIVED_DATA: ${{ github.workspace }}/build/dd
          OC_RIME_SHARED: ${{ github.workspace }}/ios/.rime-data/rime-shared
        run: bash ios/scripts/ci_step.sh uitests-embedded -- bash ios/scripts/ui-test.sh embedded OrangeCellUITests/EmbeddedKeyboardUITests
      - name: Memory with the shipped dictionary (Debug, minimal modules)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          export TEST_RUNNER_OC_INFO_FILE="$CI_OUT/logs/ocinfo.txt"
          export TEST_RUNNER_OC_RIME_SHARED="$GITHUB_WORKSPACE/ios/.rime-data/rime-shared"
          bash ios/scripts/ci_step.sh memory-debug-minimal -- xcodebuild test-without-building \
            -project ios/OrangeCell.xcodeproj -scheme OrangeCell -configuration Debug \
            -destination "id=$SIM_UDID" -derivedDataPath build/dd \
            -only-testing:OrangeCellTests/MemoryBudgetTests
      - name: Check that the memory-debug-minimal tests really ran
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 ios/scripts/check_tests.py "$CI_OUT/logs/memory-debug-minimal.log"
      - name: Memory with the shipped dictionary (Debug, all modules)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          export TEST_RUNNER_OC_INFO_FILE="$CI_OUT/logs/ocinfo.txt"
          export TEST_RUNNER_OC_RIME_SHARED="$GITHUB_WORKSPACE/ios/.rime-data/rime-shared"
          export TEST_RUNNER_OC_RIME_MODULES=all
          bash ios/scripts/ci_step.sh memory-debug-all -- xcodebuild test-without-building \
            -project ios/OrangeCell.xcodeproj -scheme OrangeCell -configuration Debug \
            -destination "id=$SIM_UDID" -derivedDataPath build/dd \
            -only-testing:OrangeCellTests/MemoryBudgetTests
      - name: Check that the memory-debug-all tests really ran
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 ios/scripts/check_tests.py "$CI_OUT/logs/memory-debug-all.log"
      - name: OCCore swift test (macOS, with the mock AI server on 127.0.0.1)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mock-ready"
          python3 ios/scripts/mock_ai_server.py --port 18766 --log "$CI_OUT/logs/mock-ai-unit.jsonl" --ready-file "$RUNNER_TEMP/mock-ready" > "$CI_OUT/logs/mock-ai-unit.out" 2>&1 &
          mock=$!
          for _ in $(seq 1 40); do [ -f "$RUNNER_TEMP/mock-ready" ] && break; sleep 0.25; done
          export OC_MOCK_AI_PORT=18766
          bash ios/scripts/ci_step.sh swift-test-macos -- bash -c 'cd ios/Packages/OCCore && swift test'
          code=$?
          kill "$mock" 2>/dev/null || true
          exit "$code"
      - name: Check that the OCCore tests really ran (macOS, none skipped)
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 ios/scripts/check_tests.py "$CI_OUT/logs/swift-test-macos.log"
      - name: Summary
        if: always()
        shell: bash
        run: python3 ios/scripts/ci_summary.py build-test --out "$CI_OUT" --xcresult "$RUNNER_TEMP/results/unit.xcresult"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-build-test
          path: |
            ci-out/build-test
            !ci-out/build-test/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The number the keyboard is budgeted against is a Release number.
  memory-release:
    name: memory-release
    needs: [rime-data]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-mac-setup
        with:
          job: memory-release
      - name: Create the simulator
        shell: bash
        run: bash ios/scripts/ci_step.sh simulator-create -- bash ios/scripts/create-sim.sh
      - name: Build for the simulator (Release)
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh build-sim-release -- xcodebuild build-for-testing \
            -project ios/OrangeCell.xcodeproj -scheme OrangeCell -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO ENABLE_TESTABILITY=YES \
            MARKETING_VERSION="$OC_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Memory with the shipped dictionary (Release, minimal modules)
        shell: bash
        run: |
          export TEST_RUNNER_OC_INFO_FILE="$CI_OUT/logs/ocinfo.txt"
          export TEST_RUNNER_OC_RIME_SHARED="$GITHUB_WORKSPACE/ios/.rime-data/rime-shared"
          bash ios/scripts/ci_step.sh memory-release-minimal -- xcodebuild test-without-building \
            -project ios/OrangeCell.xcodeproj -scheme OrangeCell -configuration Release \
            -destination "id=$SIM_UDID" -derivedDataPath build/dd \
            -only-testing:OrangeCellTests/MemoryBudgetTests
      - name: Check that the memory-release-minimal tests really ran
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 ios/scripts/check_tests.py "$CI_OUT/logs/memory-release-minimal.log"
      - name: Memory with the shipped dictionary (Release, all modules)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          export TEST_RUNNER_OC_INFO_FILE="$CI_OUT/logs/ocinfo.txt"
          export TEST_RUNNER_OC_RIME_SHARED="$GITHUB_WORKSPACE/ios/.rime-data/rime-shared"
          export TEST_RUNNER_OC_RIME_MODULES=all
          bash ios/scripts/ci_step.sh memory-release-all -- xcodebuild test-without-building \
            -project ios/OrangeCell.xcodeproj -scheme OrangeCell -configuration Release \
            -destination "id=$SIM_UDID" -derivedDataPath build/dd \
            -only-testing:OrangeCellTests/MemoryBudgetTests
      - name: Check that the memory-release-all tests really ran
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 ios/scripts/check_tests.py "$CI_OUT/logs/memory-release-all.log"
      - name: Summary
        if: always()
        shell: bash
        run: python3 ios/scripts/ci_summary.py memory --out "$CI_OUT"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-memory-release
          path: |
            ci-out/memory-release
            !ci-out/memory-release/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The real keyboard extension, typed into through the system keyboard on a simulator. Release is the
  # gate: typing, learning across the app's deployment and a keyboard restart, and the memory budget.
  e2e:
    name: e2e
    needs: [rime-data]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-mac-setup
        with:
          job: e2e
      - name: Create the simulator
        shell: bash
        run: bash ios/scripts/ci_step.sh simulator-create -- bash ios/scripts/create-sim.sh
      - name: Build the app, the keyboard and the UI tests (Release)
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh build-e2e -- xcodebuild build-for-testing \
            -project ios/OrangeCell.xcodeproj -scheme OCUITests -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$OC_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: End-to-end run (Release)
        shell: bash
        env:
          DERIVED_DATA: ${{ github.workspace }}/build/dd
          PRODUCTS_DIR: ${{ github.workspace }}/build/dd/Build/Products/Release-iphonesimulator
          CONFIGURATION: Release
          E2E_MODE: full
        run: bash ios/scripts/ci_step.sh e2e-run -- bash ios/scripts/e2e-sim.sh
      - name: Summary
        if: always()
        shell: bash
        run: python3 ios/scripts/ci_summary.py e2e --out "$CI_OUT"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-e2e
          path: |
            ci-out/e2e
            !ci-out/e2e/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Two host apps (two keyboard processes) share one user dictionary; a kill -9 right after a commit loses nothing.
  e2e-hosts:
    name: e2e-hosts
    needs: [rime-data]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-mac-setup
        with:
          job: e2e-hosts
      - name: Create the simulator
        shell: bash
        run: bash ios/scripts/ci_step.sh simulator-create -- bash ios/scripts/create-sim.sh
      - name: Build the app, the keyboard and the UI tests (Release)
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh build-e2e -- xcodebuild build-for-testing \
            -project ios/OrangeCell.xcodeproj -scheme OCUITests -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$OC_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Two hosts and kills (Release)
        shell: bash
        env:
          DERIVED_DATA: ${{ github.workspace }}/build/dd
          PRODUCTS_DIR: ${{ github.workspace }}/build/dd/Build/Products/Release-iphonesimulator
          CONFIGURATION: Release
          E2E_MODE: hosts
        run: bash ios/scripts/ci_step.sh e2e-run -- bash ios/scripts/e2e-sim.sh
      - name: Summary
        if: always()
        shell: bash
        run: python3 ios/scripts/ci_summary.py e2e-hosts --out "$CI_OUT"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-e2e-hosts
          path: |
            ci-out/e2e-hosts
            !ci-out/e2e-hosts/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The AI row through the real keyboard extension against a mock service on 127.0.0.1 (no real network, no real key):
  # a typo is corrected and adopted, the emoji key takes over a running assistant request, nothing is sent from a
  # password field or without Full Access, and the keyboard memory after the requests is within budget.
  e2e-ai:
    name: e2e-ai
    needs: [rime-data]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-mac-setup
        with:
          job: e2e-ai
      - name: Create the simulator
        shell: bash
        run: bash ios/scripts/ci_step.sh simulator-create -- bash ios/scripts/create-sim.sh
      - name: Build the app, the keyboard and the UI tests (Release)
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh build-e2e -- xcodebuild build-for-testing \
            -project ios/OrangeCell.xcodeproj -scheme OCUITests -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$OC_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: AI end-to-end run (Release)
        shell: bash
        env:
          DERIVED_DATA: ${{ github.workspace }}/build/dd
          PRODUCTS_DIR: ${{ github.workspace }}/build/dd/Build/Products/Release-iphonesimulator
          CONFIGURATION: Release
          E2E_MODE: ai
        run: bash ios/scripts/ci_step.sh e2e-run -- bash ios/scripts/e2e-sim.sh
      - name: Summary
        if: always()
        shell: bash
        run: python3 ios/scripts/ci_summary.py e2e-ai --out "$CI_OUT"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-e2e-ai
          path: |
            ci-out/e2e-ai
            !ci-out/e2e-ai/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The same typing run on the Debug build, for the number only (not a gate).
  e2e-debug:
    name: e2e-debug
    needs: [rime-data]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-mac-setup
        with:
          job: e2e-debug
      - name: Create the simulator
        shell: bash
        run: bash ios/scripts/ci_step.sh simulator-create -- bash ios/scripts/create-sim.sh
      - name: Build the app, the keyboard and the UI tests (Debug)
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh build-e2e -- xcodebuild build-for-testing \
            -project ios/OrangeCell.xcodeproj -scheme OCUITests -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$OC_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Typing run (Debug)
        shell: bash
        env:
          DERIVED_DATA: ${{ github.workspace }}/build/dd
          PRODUCTS_DIR: ${{ github.workspace }}/build/dd/Build/Products/Debug-iphonesimulator
          CONFIGURATION: Debug
          E2E_MODE: typing
        run: bash ios/scripts/ci_step.sh e2e-run -- bash ios/scripts/e2e-sim.sh
      - name: Summary
        if: always()
        shell: bash
        run: python3 ios/scripts/ci_summary.py e2e-debug --out "$CI_OUT"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-e2e-debug
          path: |
            ci-out/e2e-debug
            !ci-out/e2e-debug/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  ipa-device:
    name: ipa-device
    needs: [rime-data]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-mac-setup
        with:
          job: ipa-device
          variants: os64
      - name: Build for device (unsigned)
        shell: bash
        run: |
          bash ios/scripts/ci_step.sh build-device -- xcodebuild build \
            -project ios/OrangeCell.xcodeproj -scheme OrangeCell -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$OC_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Package the IPA (ad-hoc signature with entitlements)
        shell: bash
        run: |
          mkdir -p dist-ipa
          bash ios/scripts/ci_step.sh make-ipa -- bash ios/scripts/make-ipa.sh \
            build/dd-device/Build/Products/Release-iphoneos/OrangeCell.app \
            "dist-ipa/OrangeCell-iOS-$OC_VERSION.ipa" ios/Config
      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ipa-device
          path: |
            dist-ipa/*.ipa
            dist-ipa/entitlements.json
          compression-level: 1
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        if: always()
        shell: bash
        run: python3 ios/scripts/ci_summary.py ipa --out "$CI_OUT"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-ipa-device
          path: |
            ci-out/ipa-device
            !ci-out/ipa-device/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: release
    needs: [core-linux, build-test, memory-release, e2e, e2e-hosts, e2e-ai, ipa-device]
    if: github.ref == 'refs/heads/ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # A release that is running is never cancelled by a newer push. GitHub keeps only one *pending* job per
    # group and drops older pending ones, so at most the newest waiting release survives: the newest build
    # wins. publish-release.sh and ci_publish.py also refuse to replace a newer published build.
    concurrency:
      group: ios-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare
        shell: bash
        run: |
          echo "CI_OUT=$GITHUB_WORKSPACE/ci-out/release" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/ci-out/release/logs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ipa-device
          path: dist-ipa
      - name: Publish the ios-nightly prerelease and write the SideStore source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ios/scripts/ci_step.sh release -- bash ios/scripts/publish-release.sh
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "#### release"
            echo "- release: https://github.com/$GITHUB_REPOSITORY/releases/tag/ios-nightly"
            echo "- SideStore source: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/ci-results/sidestore/source.json"
            ls -l dist-ipa 2>/dev/null | sed 's/^/- /' || true
          } > "$CI_OUT/summary.md"
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-release
          path: |
            ci-out/release
            !ci-out/release/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish-results:
    name: publish-results
    if: always()
    needs: [core-linux, rime-data, build-test, memory-release, e2e, e2e-hosts, e2e-ai, e2e-debug, ipa-device, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    # One group per run: GitHub keeps only one *pending* job per group and would silently
    # drop the others. ci_publish.py serialises through its push retry loop instead.
    concurrency:
      group: ci-results-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: ci-*
          path: ci-collected
      - name: Publish to the ci-results branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          COLLECTED: ci-collected
        run: python3 ios/scripts/ci_publish.py
