# Zephyr Input adaptation of Wanxiang full-pinyin data and algebra (CC BY 4.0).
# https://github.com/amzxyz/rime-wanxiang · amzxyz and contributors.
# Layout, script switching and candidate selection use the existing Zephyr interface.
schema:
  schema_id: zephyr_wanxiang
  name: 万象拼音 · Zephyr
  version: '1.0'
  author: [amzxyz, Zephyr Input]
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
  - name: traditionalization
    reset: 0
    states: [简体, 繁體]
  - name: full_shape
    reset: 0
    states: [半角, 全角]
  - name: ascii_punct
    states: [中文标点, 英文标点]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, table_translator@custom_phrase, script_translator]
  filters: [simplifier@traditionalization, uniquifier]
traditionalization:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none
  inherit_comment: false
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  algebra:
    __patch:
      - zephyr_wanxiang_d_2a94c48aa51e_algebra:/base/全拼
translator:
  dictionary: zephyr_wanxiang_d_2a94c48aa51e
  prism: zephyr_wanxiang_d_2a94c48aa51e
  user_dict: zephyr_wanxiang
  contextual_suggestions: false
  max_homophones: 8
  enable_user_dict: true
  enable_word_completion: true
  spelling_hints: 8
  preedit_format:
    - xform/([jqxy])v/$1u/
    - xform/([nl])ue/$1ve/
custom_phrase:
  dictionary: ''
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99
punctuator:
  import_preset: default
key_binder:
  import_preset: default
recognizer:
  import_preset: default
__patch:
  - zephyr_wanxiang.custom:/patch?
